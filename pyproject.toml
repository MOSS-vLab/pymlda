# pyproject.toml
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymlda"
version = "0.2.0"
description = "Python Machine Learning for Damage Assessment - SHM Toolkit"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Marcela Machado", email = "mromarcela@example.com"}
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "xgboost>=1.5.0",
    "imbalanced-learn>=0.9.0",
    "openpyxl>=3.0.0"
]

[project.urls]
Homepage = "https://github.com/MOSS-vLab/pymlda"
Repository = "https://github.com/MOSS-vLab/pymlda.git"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pymlda*"]